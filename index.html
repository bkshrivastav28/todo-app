<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My To-Do List</title>

  <!-- ========== CSS: how things LOOK ========== -->
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #e8eef7;
      color: #1b2430;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }
    .app {
      background: white;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(30, 60, 120, 0.12);
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    #count { margin: 0 0 18px; color: #5c6b80; font-size: 0.95rem; }

    .add-row { display: flex; gap: 8px; margin-bottom: 18px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1.5px solid #c5d0e0;
      border-radius: 8px;
    }
    input[type="text"]:focus { outline: 2px solid #2f5de0; border-color: transparent; }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #2f5de0;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #2349b8; }

    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #edf1f7;
    }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #98a4b5; }
    li button.delete {
      background: transparent;
      color: #b3402f;
      padding: 4px 8px;
    }
    li button.delete:hover { background: #fbe9e6; }
    .empty { color: #5c6b80; padding: 12px 0; }
  </style>
</head>

<body>
  <!-- ========== HTML: the STRUCTURE (what is on the page) ========== -->
  <div class="app">
    <h1>My tasks</h1>
    <p id="count"></p>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What needs doing?" />
      <button id="addBtn">Add task</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <!-- ========== JavaScript: how things BEHAVE ========== -->
  <script>
    // 1. Grab the elements we need from the page
    const input = document.getElementById("taskInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("taskList");
    const countText = document.getElementById("count");

    // 2. Our data: a list of tasks. Each task looks like { text: "Buy milk", done: false }
    //    We load saved tasks from the browser, or start with an empty list.
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    // 3. Save tasks so they are still there after you close the tab
    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    // 4. Draw the tasks on screen. We call this every time something changes.
    function render() {
      list.innerHTML = ""; // clear the list first

      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty">Nothing here yet. Add your first task above.</li>';
      }

      tasks.forEach(function (task, index) {
        const li = document.createElement("li");
        if (task.done) li.classList.add("done");

        // checkbox: tick a task as done
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.addEventListener("change", function () {
          tasks[index].done = checkbox.checked;
          save();
          render();
        });

        // the task text
        const span = document.createElement("span");
        span.textContent = task.text;

        // delete button
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.className = "delete";
        del.addEventListener("click", function () {
          tasks.splice(index, 1); // remove 1 item at this position
          save();
          render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });

      // update the "x of y done" line
      const doneCount = tasks.filter(function (t) { return t.done; }).length;
      countText.textContent = doneCount + " of " + tasks.length + " done";
    }

    // 5. Add a new task
    function addTask() {
      const text = input.value.trim(); // trim removes extra spaces
      if (text === "") return;         // ignore empty input
      tasks.push({ text: text, done: false });
      input.value = "";
      save();
      render();
    }

    // 6. Connect actions to functions
    addBtn.addEventListener("click", addTask);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addTask();
    });

    // 7. Draw everything once when the page first opens
    render();
  </script>
</body>
</html>
